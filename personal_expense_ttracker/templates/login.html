<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · MyBudget</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <a class="brand" href="{{ url_for('add') }}"><span class="brand-mark">M</span> MyBudget</a>
    <section class="auth-card">
      <div class="card-heading"><span class="eyebrow">WELCOME BACK</span><h1>Sign in</h1><p>Pick up where you left off.</p></div>
      {% if msg %}<div class="notice error" role="alert">{{ msg }}</div>{% endif %}
      <form action="{{ url_for('login') }}" method="POST">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="Your username" required value="{{ request.form.get('username', '') }}">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
        <button type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-switch">New to MyBudget? <a href="{{ url_for('signup') }}">Create an account</a></p>
    </section>
    <p class="auth-footnote">A simple, private place to understand your spending.</p>
  </main>
</body>
</html>
