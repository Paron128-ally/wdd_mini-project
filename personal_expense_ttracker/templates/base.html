<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MyBudget{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <a class="navbar-brand" href="{{ url_for('home') }}">MyBudget</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="main-nav">
      <ul class="navbar-nav mr-auto">
        {% if session.get('user_id') %}
        <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Overview</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('transactions') }}">Add transaction</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('display') }}">Transactions</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('budgets') }}">Budgets</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('categories') }}">Categories</a></li>
        {% endif %}
      </ul>
      {% if session.get('user_id') %}<span class="navbar-text mr-3">{{ session.get('username') }}</span><a class="btn btn-primary" href="{{ url_for('logout') }}">Sign out</a>{% else %}<a class="btn btn-primary" href="{{ url_for('signin') }}">Sign in</a>{% endif %}
    </div>
  </nav>
  {% block body %}{% endblock %}
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
